services:
  - type: web
    name: document-automation-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: CLOUD_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: APP_DATA_DIR
        value: /data
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_VERIFICATION_DEV_CODE_ENABLED
        value: "false"
      - key: PASSWORD_RESET_DEV_CODE_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TRANSLATION_PROVIDER
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_LIVE_ENABLED
        value: "false"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYMENT_TEST_MODE
        value: "false"
      - key: PADDLE_ENV
        value: sandbox
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_MAP
        value: "{}"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: document-automation-data
      mountPath: /data
      sizeGB: 10
